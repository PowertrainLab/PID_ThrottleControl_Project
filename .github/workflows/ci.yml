name: MATLAB CI

on:
  push:
    branches: [ develop, main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v1

      - name: Run project validation
        uses: matlab-actions/run-command@v1
        with:
          command: |
            cd scripts
            run_tests
# GitHub Actions CI template
